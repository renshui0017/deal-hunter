name: Deal Hunter Collect

on:
  schedule:
    # Every 2 hours, UTC. GitHub Actions runs this on GitHub's own runners:
    # no machine to keep awake, no card, free for public repos.
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "collect.py"
      - "sources.json"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run collector
        run: python collect.py

      - name: Commit and push results
        run: |
          git config user.name "deal-hunter-bot"
          git config user.email "deal-hunter-bot@users.noreply.github.com"
          git add deals.json seen.json archive.json last_run.json watchlist_state.json
          # last_run.json changes on every run (run_at timestamp), so there is
          # always a commit: this keeps the repo active, which also prevents
          # GitHub from auto-disabling the scheduled workflow after 60 days.
          git diff --cached --quiet || git commit -m "chore: scheduled collect $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Purge jsDelivr cache so the Space sees fresh data
        run: |
          curl -s "https://purge.jsdelivr.net/gh/renshui0017/deal-hunter@main/deals.json" || true
          curl -s "https://purge.jsdelivr.net/gh/renshui0017/deal-hunter@main/last_run.json" || true
